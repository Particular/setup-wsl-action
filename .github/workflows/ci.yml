name: CI
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}${{ matrix.name == 'Windows' && format('-WSL_Distro:{0}-{1}', matrix.wsl_distribution, matrix.cache_label) || '' }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            wsl_distribution: Ubuntu
            cache: true
            cache_label: cached
          # Non-cached variant: exercises the fresh-install path (distro download +
          # Docker install) that the cached job skips.
          - os: windows-latest
            name: Windows
            wsl_distribution: Ubuntu
            cache: false
            cache_label: nocache
          # Debian non-cached variant: exercises the fresh-install path (distro download +
          # Docker install) that the cached job skips.
          - os: windows-latest
            name: Windows
            wsl_distribution: Debian
            cache: false
            cache_label: nocache
          - os: windows-latest
            name: Windows
            wsl_distribution: Debian
            cache: true
            cache_label: cached
          - os: ubuntu-latest
            name: Linux
            wsl_distribution: Debian
            cache: true
            cache_label: ''
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup WSL
        uses: ./
        id: wsl
        with:
          distribution: ${{ matrix.wsl_distribution }}
          memory: 4GB
          enable-cache: ${{ matrix.cache }}
      - name: Verify
        shell: pwsh
        run: |
          Write-Host "wsl-ip = ${{ steps.wsl.outputs.wsl-ip }}"
          Write-Host "distribution = ${{ steps.wsl.outputs.distribution }}"
          Write-Host "WSL_IP env = $Env:WSL_IP"
          Write-Host "WSL_DISTRIBUTION env = $Env:WSL_DISTRIBUTION"
          Write-Host "WSL_TOOLS_MODULE_PATH env = $Env:WSL_TOOLS_MODULE_PATH"

          if (-not $Env:WSL_IP) {
            throw "WSL_IP environment variable not set"
          }

          # Dogfood: import the module this action ships for consumers, on both OSes.
          Import-Module $Env:WSL_TOOLS_MODULE_PATH

          if ($Env:RUNNER_OS -eq "Windows") {
            Write-Host "Verifying Docker is running inside WSL ($Env:WSL_DISTRIBUTION)..."
            # Dogfood: omit -Distribution so it defaults to $WSL_DISTRIBUTION.
            $output = (Invoke-Wsl -CheckExitCode -Command "docker info --format '{{.ServerVersion}}'") -replace "`0", ""
            Write-Host "Docker server version: $output"

            # The bridge subnet must be the pinned 10.x one (setup.ps1 writes
            # /etc/docker/daemon.json) — not Docker's default 172.17.0.0/16,
            # which overlaps WSL2's random NAT subnet (172.16.0.0/12) and breaks
            # host->container port publishing.
            $bridgeSubnet = ((Invoke-Wsl -CheckExitCode -Command "docker network inspect bridge --format '{{(index .IPAM.Config 0).Subnet}}'") -replace "`0", "").Trim()
            Write-Host "Docker bridge subnet: $bridgeSubnet"
            if ($bridgeSubnet -ne "10.11.0.0/24") {
              throw "Expected Docker bridge subnet 10.11.0.0/24, got $bridgeSubnet"
            }
          }
          else {
            Write-Host "Linux runner — verifying Docker is available..."
            docker info --format '{{.ServerVersion}}'
            if ($LASTEXITCODE -ne 0) {
              throw "Docker is not available on the runner"
            }
          }

          # Dogfood: Invoke-DockerCompose on both OSes. `config` only renders the file, so no image is pulled.
          # The directory name contains a space on purpose.
          $composeDirectory = Join-Path $Env:RUNNER_TEMP "wsl tools compose check"
          New-Item -ItemType Directory -Path $composeDirectory -Force | Out-Null
          $composeFilePath = Join-Path $composeDirectory "compose.yml"
          Set-Content -Path $composeFilePath -Value @'
          name: wsltools-check
          services:
            probe:
              image: busybox
              environment:
                PROBE_VALUE: "${PROBE_VALUE:?PROBE_VALUE is required}"
          '@

          Write-Host "Verifying Invoke-DockerCompose -CheckExitCode throws when Compose fails (PROBE_VALUE not set)..."
          $composeError = $null
          try {
            Invoke-DockerCompose -CheckExitCode -ComposeFilePath $composeFilePath -Arguments "config"
          }
          catch {
            $composeError = $_.Exception.Message
          }
          if ($composeError -notmatch "failed with exit code") {
            throw "Expected Invoke-DockerCompose -CheckExitCode to throw on a failing command, got: $composeError"
          }

          Write-Host "Verifying Invoke-DockerCompose passes -Environment through to Compose..."
          $probeValue = 'it''s a "quoted" $HOME `value` \\ end'
          $composeConfig = Invoke-DockerCompose -CheckExitCode -ComposeFilePath $composeFilePath -Arguments "config", "--format", "json" -Environment @{ PROBE_VALUE = $probeValue }
          # `config` escapes `$` as `$$` in its output.
          $renderedValue = ($composeConfig | ConvertFrom-Json).services.probe.environment.PROBE_VALUE -replace '\$\$', '$'
          if ($renderedValue -cne $probeValue) {
            throw "Expected PROBE_VALUE '$probeValue' in the compose config, got '$renderedValue'"
          }
          if (Test-Path Env:PROBE_VALUE) {
            throw "Invoke-DockerCompose left PROBE_VALUE in the process environment"
          }