name: CI
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    name: ${{ matrix.name }}${{ matrix.name == 'Windows' && format('-WSL_Distro:{0}', matrix.wsl_distribution) || '' }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            wsl_distribution: Ubuntu
            allow_failure: false
          # Debian's WSL image on salsa.debian.org is currently serving inconsistent bytes
          # upstream (Wsl/InstallDistro/VerifyChecksum/TRUST_E_BAD_DIGEST). Kept as a
          # non-blocking job so we notice when it recovers.
          # See https://github.com/microsoft/WSL/issues/41279
          - os: windows-latest
            name: Windows
            wsl_distribution: Debian
            allow_failure: true
          - os: ubuntu-latest
            name: Linux
            wsl_distribution: Debian
            allow_failure: false
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup WSL
        uses: ./
        id: wsl
        with:
          distribution: ${{ matrix.wsl_distribution }}
          memory: 4GB
      - name: Verify
        shell: pwsh
        run: |
          Write-Host "wsl-ip = ${{ steps.wsl.outputs.wsl-ip }}"
          Write-Host "distribution = ${{ steps.wsl.outputs.distribution }}"
          Write-Host "WSL_IP env = $Env:WSL_IP"
          Write-Host "WSL_DISTRIBUTION env = $Env:WSL_DISTRIBUTION"

          if (-not $Env:WSL_IP) {
            throw "WSL_IP environment variable not set"
          }

          if ($Env:RUNNER_OS -eq "Windows") {
            $distro = $Env:WSL_DISTRIBUTION
            Write-Host "Verifying Docker is running inside WSL ($distro)..."
            $output = (wsl.exe --distribution $distro -- docker info --format '{{.ServerVersion}}') -replace "`0", ""
            Write-Host "Docker server version: $output"
            if ($LASTEXITCODE -ne 0) {
              throw "Docker is not running inside WSL"
            }
          }
          else {
            Write-Host "Linux runner — verifying Docker is available..."
            docker info --format '{{.ServerVersion}}'
            if ($LASTEXITCODE -ne 0) {
              throw "Docker is not available on the runner"
            }
          }