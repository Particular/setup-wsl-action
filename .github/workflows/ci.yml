name: CI
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}${{ matrix.name == 'Windows' && format('-WSL_Distro:{0}-{1}', matrix.wsl_distribution, matrix.cache_label) || '' }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            wsl_distribution: Ubuntu
            cache: true
            cache_label: cached
          # Non-cached variant: exercises the fresh-install path (distro download +
          # Docker install) that the cached job skips.
          - os: windows-latest
            name: Windows
            wsl_distribution: Ubuntu
            cache: false
            cache_label: nocache
          # Debian non-cached variant: exercises the fresh-install path (distro download +
          # Docker install) that the cached job skips.
          - os: windows-latest
            name: Windows
            wsl_distribution: Debian
            cache: false
            cache_label: nocache
          - os: windows-latest
            name: Windows
            wsl_distribution: Debian
            cache: true
            cache_label: cached
          - os: ubuntu-latest
            name: Linux
            wsl_distribution: Debian
            cache: true
            cache_label: ''
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup WSL
        uses: ./
        id: wsl
        with:
          distribution: ${{ matrix.wsl_distribution }}
          memory: 4GB
          enable-cache: ${{ matrix.cache }}
      - name: Verify
        shell: pwsh
        run: ./.github/scripts/verify.ps1 -WslIpOutput '${{ steps.wsl.outputs.wsl-ip }}' -DistributionOutput '${{ steps.wsl.outputs.distribution }}'
